global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: serving
    static_configs:
      - targets: ['champion-model:8080']

  - job_name: router
    static_configs:
      - targets: ['router:8081']

  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
